name: Auto Preprocessing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preprocessing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.7"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run preprocessing
        working-directory: preprocessing
        run: python automate_Sheren-Failla.py

      - name: Validate processed dataset
        run: |
          test -s preprocessing/telco_preprocessing/telco_train.csv
          test -s preprocessing/telco_preprocessing/telco_test.csv

      - name: Upload processed dataset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: telco-preprocessed-${{ github.sha }}
          path: preprocessing/telco_preprocessing/
          if-no-files-found: error
          retention-days: 14
